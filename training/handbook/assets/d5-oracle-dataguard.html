<!doctype html><html lang='en'><head><meta charset='utf-8'><title>Figure 5 — Oracle Data Guard switchover sequence</title><style>body{margin:0;padding:24px;background:#fff}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1030" width="100%" role="img" preserveAspectRatio="xMidYMid meet" style="max-width:1440px;height:auto;background:#fff;font-family:Inter,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;">
<defs><pattern id="d5-oracle-dataguard-grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#e6ebf2" stroke-width="1"/></pattern><filter id="d5-oracle-dataguard-sh" x="-14%" y="-14%" width="132%" height="155%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b2545" flood-opacity="0.14"/></filter><linearGradient id="d5-oracle-dataguard-hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f2b4c"/><stop offset="1" stop-color="#1b4f86"/></linearGradient><marker id="d5-oracle-dataguard-arrow" markerWidth="9" markerHeight="9" refX="7.4" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3.2 L0 6.4 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="1030" rx="0" fill="url(#d5-oracle-dataguard-grid)" stroke="none" stroke-width="1.5"/><text x="40" y="52" font-size="21" fill="#0f2b4c" font-weight="800" text-anchor="start" letter-spacing="-0.2">Figure 5 — Oracle Data Guard migration: switchover, SCN synchronisation and rollback</text><rect x="40" y="62" width="74" height="4" rx="2" fill="#1b4f86" stroke="none" stroke-width="1.5"/><text x="40" y="78" font-size="13.5" fill="#5b7288" font-weight="500" text-anchor="start">A switchover is a planned, reversible role swap. A failover is disaster recovery and is not reversible in the same way. This module covers the planned switchover only.</text><rect x="60" y="116" width="560" height="250" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="1.5" filter="url(#d5-oracle-dataguard-sh)"/><path d="M60 156 V128 A12 12 0 0 1 72 116 H608 A12 12 0 0 1 620 128 V156 Z" fill="#5c2b2b"/><text x="340.0" y="141.04" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0.2">SOURCE — on-premises / source DC</text><rect x="88" y="180" width="236" height="100" rx="10" fill="#fdecec" stroke="#c8434b" stroke-width="1.5"/><text x="206" y="212" font-size="15" fill="#7d2b30" font-weight="800" text-anchor="middle">PRIMARY</text><text x="206" y="239.64" font-size="11.5" fill="#8d4a4e" font-weight="600" text-anchor="middle">Open and serving SAP</text><text x="206" y="256.64" font-size="11.5" fill="#8d4a4e" font-weight="600" text-anchor="middle">Generates archive/redo</text><rect x="356" y="180" width="236" height="100" rx="10" fill="#f3f5f9" stroke="#c7d2e0" stroke-width="1.5"/><text x="474" y="212" font-size="13" fill="#3d5468" font-weight="800" text-anchor="middle">AFTER SWITCHOVER</text><text x="474" y="239.64" font-size="11.5" fill="#5b7288" font-weight="600" text-anchor="middle">Shut down after final</text><text x="474" y="256.64" font-size="11.5" fill="#5b7288" font-weight="600" text-anchor="middle">validation and snapshot</text><rect x="88" y="300" width="504" height="40" rx="8" fill="#ffffff" stroke="#c7d2e0" stroke-width="1.5"/><text x="340" y="325" font-size="12" fill="#3d5468" font-weight="600" text-anchor="middle">SCN source:  SELECT current_scn FROM v$database;</text><rect x="820" y="116" width="560" height="250" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="1.5" filter="url(#d5-oracle-dataguard-sh)"/><path d="M820 156 V128 A12 12 0 0 1 832 116 H1368 A12 12 0 0 1 1380 128 V156 Z" fill="#123b2a"/><text x="1100.0" y="141.04" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0.2">TARGET — AWS</text><rect x="848" y="180" width="236" height="100" rx="10" fill="#e8f0fb" stroke="#1b4f86" stroke-width="1.5"/><text x="966" y="212" font-size="15" fill="#0f2b4c" font-weight="800" text-anchor="middle">STANDBY</text><text x="966" y="239.64" font-size="11.5" fill="#3d5468" font-weight="600" text-anchor="middle">Managed recovery applying</text><text x="966" y="256.64" font-size="11.5" fill="#3d5468" font-weight="600" text-anchor="middle">redo shipped from source</text><rect x="1116" y="180" width="236" height="100" rx="10" fill="#e6f4ea" stroke="#3d9a5f" stroke-width="1.5"/><text x="1234" y="212" font-size="14" fill="#123b2a" font-weight="800" text-anchor="middle">NEW PRIMARY</text><text x="1234" y="239.64" font-size="11.5" fill="#2f6b46" font-weight="600" text-anchor="middle">Activated and opened</text><text x="1234" y="256.64" font-size="11.5" fill="#2f6b46" font-weight="600" text-anchor="middle">after switchover</text><rect x="848" y="300" width="504" height="40" rx="8" fill="#ffffff" stroke="#c7d2e0" stroke-width="1.5"/><text x="1100" y="325" font-size="12" fill="#3d5468" font-weight="600" text-anchor="middle">SCN target  →  values must match before switchover</text><path d="M620 214 H816" stroke="#1b4f86" stroke-width="3" fill="none" marker-end="url(#d5-oracle-dataguard-arrow)"/><text x="718" y="200" font-size="11.5" fill="#1b4f86" font-weight="700" text-anchor="middle">redo transport</text><path d="M816 250 H624" stroke="#8ea6c0" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#d5-oracle-dataguard-arrow)"/><text x="718" y="272" font-size="11" fill="#5b7288" font-weight="600" text-anchor="middle">apply / gap check</text><rect x="60" y="388" width="1320" height="442" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="1.5" filter="url(#d5-oracle-dataguard-sh)"/><circle cx="104" cy="416" r="16" fill="#1b4f86"/><text x="104" y="420.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="136" y="417" font-size="13.5" fill="#0f2b4c" font-weight="800" text-anchor="start">Pre-checks</text><text x="336" y="417" font-size="12.3" fill="#3d5468" font-weight="500" text-anchor="start">Listener and SQL*Net, Data Guard parameters, SID settings, Broker, observer node, patch-level alignment</text><line x1="104" y1="433" x2="104" y2="453" stroke="#dbe3ec" stroke-width="2"/><circle cx="104" cy="468" r="16" fill="#1b4f86"/><text x="104" y="472.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="136" y="469" font-size="13.5" fill="#0f2b4c" font-weight="800" text-anchor="start">Synchronisation review</text><text x="336" y="469" font-size="12.3" fill="#3d5468" font-weight="500" text-anchor="start">Log switching reviewed, apply lag checked, source and target SCN compared for consistency</text><line x1="104" y1="485" x2="104" y2="505" stroke="#dbe3ec" stroke-width="2"/><circle cx="104" cy="520" r="16" fill="#1b4f86"/><text x="104" y="524.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="136" y="521" font-size="13.5" fill="#0f2b4c" font-weight="800" text-anchor="start">Evidence + approval</text><text x="336" y="521" font-size="12.3" fill="#3d5468" font-weight="500" text-anchor="start">Outputs and screenshots attached to the Jira/change ticket; approval obtained before production changes</text><line x1="104" y1="537" x2="104" y2="557" stroke="#dbe3ec" stroke-width="2"/><circle cx="104" cy="572" r="16" fill="#d9a520"/><text x="104" y="576.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="136" y="573" font-size="13.5" fill="#0f2b4c" font-weight="800" text-anchor="start">Snapshot</text><text x="336" y="573" font-size="12.3" fill="#3d5468" font-weight="500" text-anchor="start">AWS disk-level snapshot of the target taken — this is the rollback recovery point</text><line x1="104" y1="589" x2="104" y2="609" stroke="#dbe3ec" stroke-width="2"/><circle cx="104" cy="624" r="16" fill="#1b4f86"/><text x="104" y="628.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="136" y="625" font-size="13.5" fill="#0f2b4c" font-weight="800" text-anchor="start">Shutdown source</text><text x="336" y="625" font-size="12.3" fill="#3d5468" font-weight="500" text-anchor="start">Application shutdown complete and DBA handover confirmed; source primary closed</text><line x1="104" y1="641" x2="104" y2="661" stroke="#dbe3ec" stroke-width="2"/><circle cx="104" cy="676" r="16" fill="#1b4f86"/><text x="104" y="680.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="136" y="677" font-size="13.5" fill="#0f2b4c" font-weight="800" text-anchor="start">Switchover / activate</text><text x="336" y="677" font-size="12.3" fill="#3d5468" font-weight="500" text-anchor="start">Target standby activated and opened as the new primary database</text><line x1="104" y1="693" x2="104" y2="713" stroke="#dbe3ec" stroke-width="2"/><circle cx="104" cy="728" r="16" fill="#3d9a5f"/><text x="104" y="732.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><text x="136" y="729" font-size="13.5" fill="#0f2b4c" font-weight="800" text-anchor="start">Post-validation</text><text x="336" y="729" font-size="12.3" fill="#3d5468" font-weight="500" text-anchor="start">New primary validated; DBVERIFY run for block corruption; RMAN backup taken; OEM agent verified</text><line x1="104" y1="745" x2="104" y2="765" stroke="#dbe3ec" stroke-width="2"/><circle cx="104" cy="780" r="16" fill="#1b4f86"/><text x="104" y="784.86" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">8</text><text x="136" y="781" font-size="13.5" fill="#0f2b4c" font-weight="800" text-anchor="start">DNS / IPAM</text><text x="336" y="781" font-size="12.3" fill="#3d5468" font-weight="500" text-anchor="start">Virtual hostname unchanged, target IP updated, CNAME repointed, resolution verified, stale host entries cleaned</text><rect x="60" y="858" width="660" height="118" rx="12" fill="#fdecec" stroke="#c8434b" stroke-width="1.5" filter="url(#d5-oracle-dataguard-sh)"/><text x="84" y="888" font-size="11.5" fill="#7d2b30" font-weight="800" text-anchor="start" letter-spacing="1.1">ROLLBACK PATH</text><text x="84" y="916" font-size="12.5" fill="#7d2b30" font-weight="600" text-anchor="start">Restore target volumes from the pre-switchover snapshot, revert DNS/CNAME to the source, restart the</text><text x="84" y="938" font-size="12.5" fill="#7d2b30" font-weight="600" text-anchor="start">source primary.</text><text x="84" y="960" font-size="12.5" fill="#7d2b30" font-weight="600" text-anchor="start">Rollback readiness is maintained until the migration is declared safe.</text><rect x="760" y="858" width="620" height="118" rx="12" fill="#fdf3d8" stroke="#d9a520" stroke-width="1.5" filter="url(#d5-oracle-dataguard-sh)"/><text x="784" y="888" font-size="11.5" fill="#8a6410" font-weight="800" text-anchor="start" letter-spacing="1.1">VALIDATION GATE</text><text x="784" y="916" font-size="12.5" fill="#5c4a12" font-weight="600" text-anchor="start">DBVERIFY clean (no corrupted blocks) → RMAN backup successful → OEM agent reporting.</text><text x="784" y="938" font-size="12.5" fill="#5c4a12" font-weight="600" text-anchor="start">Only then is the new primary considered technically accepted.</text><text x="60" y="1008" font-size="12" fill="#7b8794" font-weight="500" text-anchor="start" font-style="italic">Command-level detail (DGMGRL versus ALTER DATABASE SWITCHOVER, Broker configuration, observer placement) is defined in the project runbook, not in this handbook.</text></svg></body></html>
