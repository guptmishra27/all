<!doctype html><html lang='en'><head><meta charset='utf-8'><title>Figure 7 — Performance monitoring and troubleshooting path</title><style>body{margin:0;padding:24px;background:#fff}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 830" width="100%" role="img" preserveAspectRatio="xMidYMid meet" style="max-width:1440px;height:auto;background:#fff;font-family:Inter,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;">
<defs><pattern id="d7-performance-grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#e6ebf2" stroke-width="1"/></pattern><filter id="d7-performance-sh" x="-14%" y="-14%" width="132%" height="155%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b2545" flood-opacity="0.14"/></filter><linearGradient id="d7-performance-hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f2b4c"/><stop offset="1" stop-color="#1b4f86"/></linearGradient><marker id="d7-performance-arrow" markerWidth="9" markerHeight="9" refX="7.4" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3.2 L0 6.4 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="830" rx="0" fill="url(#d7-performance-grid)" stroke="none" stroke-width="1.5"/><text x="40" y="52" font-size="21" fill="#0f2b4c" font-weight="800" text-anchor="start" letter-spacing="-0.2">Figure 7 — Performance monitoring, memory escalation and troubleshooting path</text><rect x="40" y="62" width="74" height="4" rx="2" fill="#1b4f86" stroke="none" stroke-width="1.5"/><text x="40" y="78" font-size="13.5" fill="#5b7288" font-weight="500" text-anchor="start">Top-down triage: workload statistics first, individual records second, memory and buffer behaviour third, root cause before any parameter change.</text><rect x="60" y="116" width="430" height="470" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="1.5" filter="url(#d7-performance-sh)"/><path d="M60 156 V128 A12 12 0 0 1 72 116 H478 A12 12 0 0 1 490 128 V156 Z" fill="url(#d7-performance-hdr)"/><text x="275.0" y="141.04" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0.2">ST02 — SAP memory escalation</text><rect x="84" y="180" width="382" height="62" rx="9" fill="#e8f0fb" stroke="#1b4f86" stroke-width="1.5"/><text x="275" y="205" font-size="13" fill="#0f2b4c" font-weight="800" text-anchor="middle">Roll area / roll memory</text><text x="275" y="226" font-size="11" fill="#5b7288" font-weight="600" text-anchor="middle">Per work process; rolled-out user context</text><line x1="275" y1="242" x2="275" y2="254" stroke="#8ea6c0" stroke-width="2.2" marker-end="url(#d7-performance-arrow)"/><rect x="84" y="258" width="382" height="62" rx="9" fill="#e8f0fb" stroke="#1b4f86" stroke-width="1.5"/><text x="275" y="283" font-size="13" fill="#0f2b4c" font-weight="800" text-anchor="middle">Extended memory (EM)</text><text x="275" y="304" font-size="11" fill="#5b7288" font-weight="600" text-anchor="middle">Shared pool used first for user context</text><line x1="275" y1="320" x2="275" y2="332" stroke="#8ea6c0" stroke-width="2.2" marker-end="url(#d7-performance-arrow)"/><rect x="84" y="336" width="382" height="62" rx="9" fill="#fdf3d8" stroke="#d9a520" stroke-width="1.5"/><text x="275" y="361" font-size="13" fill="#0f2b4c" font-weight="800" text-anchor="middle">Heap / private memory</text><text x="275" y="382" font-size="11" fill="#5b7288" font-weight="600" text-anchor="middle">Used when EM is exhausted — process goes PRIVATE</text><line x1="275" y1="398" x2="275" y2="410" stroke="#8ea6c0" stroke-width="2.2" marker-end="url(#d7-performance-arrow)"/><rect x="84" y="414" width="382" height="62" rx="9" fill="#fdecec" stroke="#c8434b" stroke-width="1.5"/><text x="275" y="439" font-size="13" fill="#0f2b4c" font-weight="800" text-anchor="middle">Paging and swaps</text><text x="275" y="460" font-size="11" fill="#5b7288" font-weight="600" text-anchor="middle">Paging memory, roll-in / roll-out activity</text><line x1="275" y1="476" x2="275" y2="488" stroke="#8ea6c0" stroke-width="2.2" marker-end="url(#d7-performance-arrow)"/><rect x="84" y="492" width="382" height="62" rx="9" fill="#f3f5f9" stroke="#5b7288" stroke-width="1.5"/><text x="275" y="517" font-size="13" fill="#0f2b4c" font-weight="800" text-anchor="middle">Buffer memory</text><text x="275" y="538" font-size="11" fill="#5b7288" font-weight="600" text-anchor="middle">Program, single record, table, export/import buffers</text><text x="470" y="340" font-size="11" fill="#d9a520" font-weight="800" text-anchor="end">EM exhausted</text><rect x="530" y="116" width="850" height="470" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="1.5" filter="url(#d7-performance-sh)"/><path d="M530 156 V128 A12 12 0 0 1 542 116 H1368 A12 12 0 0 1 1380 128 V156 Z" fill="url(#d7-performance-hdr)"/><text x="955.0" y="141.04" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0.2">Troubleshooting path</text><rect x="556" y="176" width="800" height="42" rx="8" fill="#e8f0fb" stroke="#1b4f86" stroke-width="1.5"/><circle cx="582" cy="197" r="13" fill="#1b4f86"/><text x="582" y="201.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="606" y="194" font-size="12.8" fill="#0f2b4c" font-weight="800" text-anchor="start">Symptom reported</text><text x="606" y="210" font-size="10.8" fill="#5b7288" font-weight="600" text-anchor="start">Slow dialog, timeout, batch overrun, user complaint</text><rect x="556" y="226" width="800" height="42" rx="8" fill="#e8f0fb" stroke="#1b4f86" stroke-width="1.5"/><circle cx="582" cy="247" r="13" fill="#1b4f86"/><text x="582" y="251.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="606" y="244" font-size="12.8" fill="#0f2b4c" font-weight="800" text-anchor="start">ST03 / ST03N workload</text><text x="606" y="260" font-size="10.8" fill="#5b7288" font-weight="600" text-anchor="start">Response, DB, CPU and wait time — daily, weekly, monthly trend</text><rect x="556" y="276" width="800" height="42" rx="8" fill="#e8f0fb" stroke="#1b4f86" stroke-width="1.5"/><circle cx="582" cy="297" r="13" fill="#1b4f86"/><text x="582" y="301.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="606" y="294" font-size="12.8" fill="#0f2b4c" font-weight="800" text-anchor="start">STAD detailed records</text><text x="606" y="310" font-size="10.8" fill="#5b7288" font-weight="600" text-anchor="start">Isolate the slow transactions, users, DB-intensive or CPU-intensive steps</text><rect x="556" y="326" width="800" height="42" rx="8" fill="#fdf3d8" stroke="#d9a520" stroke-width="1.5"/><circle cx="582" cy="347" r="13" fill="#d9a520"/><text x="582" y="351.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="606" y="344" font-size="12.8" fill="#0f2b4c" font-weight="800" text-anchor="start">Classify the bottleneck</text><text x="606" y="360" font-size="10.8" fill="#5b7288" font-weight="600" text-anchor="start">High DB time → database/SQL/network · high CPU → ABAP/app · high wait → memory, enqueue, RFC</text><rect x="556" y="376" width="800" height="42" rx="8" fill="#fdf3d8" stroke="#d9a520" stroke-width="1.5"/><circle cx="582" cy="397" r="13" fill="#d9a520"/><text x="582" y="401.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="606" y="394" font-size="12.8" fill="#0f2b4c" font-weight="800" text-anchor="start">ST02 memory and buffers</text><text x="606" y="410" font-size="10.8" fill="#5b7288" font-weight="600" text-anchor="start">EM, heap/private, roll, paging, buffer utilisation and hit ratio</text><rect x="556" y="426" width="800" height="42" rx="8" fill="#fdecec" stroke="#c8434b" stroke-width="1.5"/><circle cx="582" cy="447" r="13" fill="#c8434b"/><text x="582" y="451.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="606" y="444" font-size="12.8" fill="#0f2b4c" font-weight="800" text-anchor="start">Find the root cause</text><text x="606" y="460" font-size="10.8" fill="#5b7288" font-weight="600" text-anchor="start">Missing index, poor access path, custom code, parameter, volume growth, infrastructure</text><rect x="556" y="476" width="800" height="42" rx="8" fill="#e6f4ea" stroke="#3d9a5f" stroke-width="1.5"/><circle cx="582" cy="497" r="13" fill="#3d9a5f"/><text x="582" y="501.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><text x="606" y="494" font-size="12.8" fill="#0f2b4c" font-weight="800" text-anchor="start">Fix with the owning team</text><text x="606" y="510" font-size="10.8" fill="#5b7288" font-weight="600" text-anchor="start">DBA / ABAP / Linux / Network; parameter change via the approved route (RZ10 vs RZ11)</text><rect x="556" y="526" width="800" height="42" rx="8" fill="#e6f4ea" stroke="#3d9a5f" stroke-width="1.5"/><circle cx="582" cy="547" r="13" fill="#3d9a5f"/><text x="582" y="551.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">8</text><text x="606" y="544" font-size="12.8" fill="#0f2b4c" font-weight="800" text-anchor="start">Re-baseline and evidence</text><text x="606" y="560" font-size="10.8" fill="#5b7288" font-weight="600" text-anchor="start">Re-measure against the pre-migration baseline and attach before/after evidence</text><rect x="60" y="610" width="660" height="156" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="1.5" filter="url(#d7-performance-sh)"/><text x="84" y="640" font-size="11" fill="#1b4f86" font-weight="800" text-anchor="start" letter-spacing="1.0">RZ10 vs RZ11 — PICK THE RIGHT TOOL</text><rect x="84" y="654" width="296" height="92" rx="9" fill="#e8f0fb" stroke="#1b4f86" stroke-width="1.5"/><text x="232" y="680" font-size="14" fill="#0f2b4c" font-weight="800" text-anchor="middle">RZ10</text><text x="232" y="702.96" font-size="11" fill="#3d5468" font-weight="600" text-anchor="middle">Persistent profile parameter;</text><text x="232" y="717.96" font-size="11" fill="#3d5468" font-weight="600" text-anchor="middle">import and activate; a restart</text><text x="232" y="732.96" font-size="11" fill="#3d5468" font-weight="600" text-anchor="middle">is often required</text><rect x="400" y="654" width="296" height="92" rx="9" fill="#f3f5f9" stroke="#5b7288" stroke-width="1.5"/><text x="548" y="680" font-size="14" fill="#0f2b4c" font-weight="800" text-anchor="middle">RZ11</text><text x="548" y="702.96" font-size="11" fill="#3d5468" font-weight="600" text-anchor="middle">Dynamic / temporary change where</text><text x="548" y="717.96" font-size="11" fill="#3d5468" font-weight="600" text-anchor="middle">the parameter supports it — not a</text><text x="548" y="732.96" font-size="11" fill="#3d5468" font-weight="600" text-anchor="middle">permanent configuration change</text><rect x="760" y="610" width="620" height="156" rx="12" fill="#fdf3d8" stroke="#d9a520" stroke-width="1.5" filter="url(#d7-performance-sh)"/><text x="784" y="640" font-size="11.5" fill="#8a6410" font-weight="800" text-anchor="start" letter-spacing="1.1">THRESHOLD CAUTION</text><text x="784" y="668" font-size="12" fill="#5c4a12" font-weight="600" text-anchor="start">The source training quoted ≈1200 ms response time and ≈40% average database request time as</text><text x="784" y="690" font-size="12" fill="#5c4a12" font-weight="600" text-anchor="start">discussion values.</text><text x="784" y="712" font-size="12" fill="#5c4a12" font-weight="600" text-anchor="start">Validate them against the applicable SAP and client baseline before using them as production alerting</text><text x="784" y="734" font-size="12" fill="#5c4a12" font-weight="600" text-anchor="start">thresholds.</text><text x="784" y="756" font-size="12" fill="#5c4a12" font-weight="600" text-anchor="start">Never raise a memory parameter before identifying what is consuming the memory.</text><text x="60" y="808" font-size="12" fill="#7b8794" font-weight="500" text-anchor="start" font-style="italic">ST03N is the current workload transaction; ST03 is retained here because the source material and many runbooks still reference it. STAD reads the statistical records behind the workload statistics.</text></svg></body></html>
