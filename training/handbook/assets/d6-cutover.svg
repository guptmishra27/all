<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" width="100%" role="img" preserveAspectRatio="xMidYMid meet" style="max-width:1440px;height:auto;background:#fff;font-family:Inter,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;">
<defs><pattern id="d6-cutover-grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#e6ebf2" stroke-width="1"/></pattern><filter id="d6-cutover-sh" x="-14%" y="-14%" width="132%" height="155%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b2545" flood-opacity="0.14"/></filter><linearGradient id="d6-cutover-hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f2b4c"/><stop offset="1" stop-color="#1b4f86"/></linearGradient><marker id="d6-cutover-arrow" markerWidth="9" markerHeight="9" refX="7.4" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3.2 L0 6.4 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="1000" rx="0" fill="url(#d6-cutover-grid)" stroke="none" stroke-width="1.5"/><text x="40" y="52" font-size="21" fill="#0f2b4c" font-weight="800" text-anchor="start" letter-spacing="-0.2">Figure 6 — Cutover execution sequence with Go/No-Go decision and rollback path</text><rect x="40" y="62" width="74" height="4" rx="2" fill="#1b4f86" stroke="none" stroke-width="1.5"/><text x="40" y="78" font-size="13.5" fill="#5b7288" font-weight="500" text-anchor="start">Each lane hands over explicitly. Nothing starts before the previous lane confirms completion and the evidence is attached to the change record.</text><rect x="60" y="106" width="330" height="566" rx="12" fill="#fbfcfe" stroke="#c7d2e0" stroke-width="1.5"/><rect x="60" y="106" width="330" height="40" rx="12" fill="#5b7288" stroke="none" stroke-width="1.5"/><rect x="60" y="132" width="330" height="14" rx="0" fill="#5b7288" stroke="none" stroke-width="1.5"/><text x="225.0" y="132" font-size="12.5" fill="#ffffff" font-weight="800" text-anchor="middle" letter-spacing="0.8">APPLICATION</text><rect x="404" y="106" width="330" height="566" rx="12" fill="#fbfcfe" stroke="#c7d2e0" stroke-width="1.5"/><rect x="404" y="106" width="330" height="40" rx="12" fill="#123b2a" stroke="none" stroke-width="1.5"/><rect x="404" y="132" width="330" height="14" rx="0" fill="#123b2a" stroke="none" stroke-width="1.5"/><text x="569.0" y="132" font-size="12.5" fill="#ffffff" font-weight="800" text-anchor="middle" letter-spacing="0.8">DBA</text><rect x="748" y="106" width="330" height="566" rx="12" fill="#fbfcfe" stroke="#c7d2e0" stroke-width="1.5"/><rect x="748" y="106" width="330" height="40" rx="12" fill="#1b4f86" stroke="none" stroke-width="1.5"/><rect x="748" y="132" width="330" height="14" rx="0" fill="#1b4f86" stroke="none" stroke-width="1.5"/><text x="913.0" y="132" font-size="12.5" fill="#ffffff" font-weight="800" text-anchor="middle" letter-spacing="0.8">BASIS / MIGRATION</text><rect x="1092" y="106" width="330" height="566" rx="12" fill="#fbfcfe" stroke="#c7d2e0" stroke-width="1.5"/><rect x="1092" y="106" width="330" height="40" rx="12" fill="#8a6410" stroke="none" stroke-width="1.5"/><rect x="1092" y="132" width="330" height="14" rx="0" fill="#8a6410" stroke="none" stroke-width="1.5"/><text x="1257.0" y="132" font-size="12.5" fill="#ffffff" font-weight="800" text-anchor="middle" letter-spacing="0.8">FUNCTIONAL + PMO</text><rect x="78" y="176" width="294" height="56" rx="9" fill="#ffffff" stroke="#9ec3ec" stroke-width="1.5" filter="url(#d6-cutover-sh)"/><circle cx="104" cy="204" r="13" fill="#1b4f86"/><text x="104" y="208.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="122" y="208.176" font-size="11.6" fill="#3d5468" font-weight="600" text-anchor="start">Cooldown / ramp-up activities complete</text><rect x="78" y="250" width="294" height="56" rx="9" fill="#ffffff" stroke="#9ec3ec" stroke-width="1.5" filter="url(#d6-cutover-sh)"/><circle cx="104" cy="278" r="13" fill="#1b4f86"/><text x="104" y="282.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="122" y="282.176" font-size="11.6" fill="#3d5468" font-weight="600" text-anchor="start">Application and web services stopped</text><rect x="78" y="324" width="294" height="56" rx="9" fill="#ffffff" stroke="#9ec3ec" stroke-width="1.5" filter="url(#d6-cutover-sh)"/><circle cx="104" cy="352" r="13" fill="#1b4f86"/><text x="104" y="356.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="122" y="356.176" font-size="11.6" fill="#3d5468" font-weight="600" text-anchor="start">Handover to the DBA team confirmed</text><rect x="422" y="250" width="294" height="56" rx="9" fill="#ffffff" stroke="#9ec3ec" stroke-width="1.5" filter="url(#d6-cutover-sh)"/><circle cx="448" cy="278" r="13" fill="#1b4f86"/><text x="448" y="282.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="466" y="282.176" font-size="11.6" fill="#3d5468" font-weight="600" text-anchor="start">Final backup and AWS disk-level snapshot</text><rect x="422" y="340" width="294" height="56" rx="9" fill="#ffffff" stroke="#9ec3ec" stroke-width="1.5" filter="url(#d6-cutover-sh)"/><circle cx="448" cy="368" r="13" fill="#1b4f86"/><text x="448" y="372.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="466" y="372.176" font-size="11.6" fill="#3d5468" font-weight="600" text-anchor="start">Data Guard switchover or HANA recovery</text><rect x="422" y="430" width="294" height="56" rx="9" fill="#ffffff" stroke="#9ec3ec" stroke-width="1.5" filter="url(#d6-cutover-sh)"/><circle cx="448" cy="458" r="13" fill="#1b4f86"/><text x="448" y="462.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="466" y="462.176" font-size="11.6" fill="#3d5468" font-weight="600" text-anchor="start">DBVERIFY, RMAN and database validation</text><rect x="766" y="430" width="294" height="56" rx="9" fill="#ffffff" stroke="#9ec3ec" stroke-width="1.5" filter="url(#d6-cutover-sh)"/><circle cx="792" cy="458" r="13" fill="#1b4f86"/><text x="792" y="462.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><text x="810" y="454.676" font-size="11.6" fill="#3d5468" font-weight="600" text-anchor="start">rsync SAP global directory; clean</text><text x="810" y="469.676" font-size="11.6" fill="#3d5468" font-weight="600" text-anchor="start">host/IPAM entries</text><rect x="766" y="504" width="294" height="56" rx="9" fill="#ffffff" stroke="#9ec3ec" stroke-width="1.5" filter="url(#d6-cutover-sh)"/><circle cx="792" cy="532" r="13" fill="#1b4f86"/><text x="792" y="536.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">8</text><text x="810" y="528.676" font-size="11.6" fill="#3d5468" font-weight="600" text-anchor="start">Validate profile parameters, kernel</text><text x="810" y="543.676" font-size="11.6" fill="#3d5468" font-weight="600" text-anchor="start">permissions, root scripts</text><rect x="766" y="578" width="294" height="56" rx="9" fill="#ffffff" stroke="#9ec3ec" stroke-width="1.5" filter="url(#d6-cutover-sh)"/><circle cx="792" cy="606" r="13" fill="#1b4f86"/><text x="792" y="610.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">9</text><text x="810" y="602.676" font-size="11.6" fill="#3d5468" font-weight="600" text-anchor="start">R3TRANS -d must return code 0000 before</text><text x="810" y="617.676" font-size="11.6" fill="#3d5468" font-weight="600" text-anchor="start">SAP start</text><rect x="766" y="636" width="294" height="56" rx="9" fill="#ffffff" stroke="#9ec3ec" stroke-width="1.5" filter="url(#d6-cutover-sh)"/><circle cx="792" cy="664" r="13" fill="#1b4f86"/><text x="792" y="668.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">10</text><text x="810" y="660.676" font-size="11.6" fill="#3d5468" font-weight="600" text-anchor="start">Start SAP; validate SNC/SSO, certificates,</text><text x="810" y="675.676" font-size="11.6" fill="#3d5468" font-weight="600" text-anchor="start">Gateway, RFC</text><rect x="1110" y="636" width="294" height="56" rx="9" fill="#ffffff" stroke="#9ec3ec" stroke-width="1.5" filter="url(#d6-cutover-sh)"/><circle cx="1136" cy="664" r="13" fill="#1b4f86"/><text x="1136" y="668.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">11</text><text x="1154" y="660.676" font-size="11.6" fill="#3d5468" font-weight="600" text-anchor="start">Business transaction tests, interfaces,</text><text x="1154" y="675.676" font-size="11.6" fill="#3d5468" font-weight="600" text-anchor="start">printers, evidence</text><path d="M372 352 H392 V278 H416" stroke="#8ea6c0" stroke-width="2.4" fill="none" marker-end="url(#d6-cutover-arrow)"/><text x="392" y="392" font-size="10.5" fill="#5b7288" font-weight="700" text-anchor="middle">handover</text><path d="M716 458 H736 V458 H760" stroke="#8ea6c0" stroke-width="2.4" fill="none" marker-end="url(#d6-cutover-arrow)"/><path d="M1046 664 H1090 V664 H1104" stroke="#8ea6c0" stroke-width="2.4" fill="none" marker-end="url(#d6-cutover-arrow)"/><path d="M720 672 V706" stroke="#8ea6c0" stroke-width="2.6" fill="none" marker-end="url(#d6-cutover-arrow)"/><polygon points="720.0,706.0 870.0,768 720.0,830.0 570.0,768" fill="#fdf3d8" stroke="#d9a520" stroke-width="2"/><text x="720.0" y="762" font-size="17" fill="#8a6410" font-weight="800" text-anchor="middle">Go / No-Go</text><text x="720.0" y="786" font-size="11.5" fill="#8a6410" font-weight="600" text-anchor="middle">technical + functional + owner sign-off</text><path d="M870.0 768 H1120 V858" stroke="#3d9a5f" stroke-width="3" fill="none" marker-end="url(#d6-cutover-arrow)"/><rect x="938.0" y="755.0" width="64" height="26" rx="13" fill="#3d9a5f" stroke="#3d9a5f" stroke-width="1.5"/><text x="970.0" y="772.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0.3">GO</text><rect x="760" y="858" width="620" height="100" rx="12" fill="#e6f4ea" stroke="#3d9a5f" stroke-width="1.5" filter="url(#d6-cutover-sh)"/><text x="784" y="888" font-size="11.5" fill="#123b2a" font-weight="800" text-anchor="start" letter-spacing="1.1">GO-LIVE &amp; HYPERCARE</text><text x="1070" y="918.82" font-size="12" fill="#2f6b46" font-weight="600" text-anchor="middle">Unlock users · resume background jobs and Control-M · complete EDG / SAProuter configuration</text><text x="1070" y="937.82" font-size="12" fill="#2f6b46" font-weight="600" text-anchor="middle">15 days of hypercare · classify each issue as migration-related or pre-existing and route it</text><path d="M570.0 768 H320 V858" stroke="#c8434b" stroke-width="3" fill="none" marker-end="url(#d6-cutover-arrow)"/><rect x="428.0" y="755.0" width="84" height="26" rx="13" fill="#c8434b" stroke="#c8434b" stroke-width="1.5"/><text x="470.0" y="772.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0.3">NO-GO</text><rect x="60" y="858" width="660" height="100" rx="12" fill="#fdecec" stroke="#c8434b" stroke-width="1.5" filter="url(#d6-cutover-sh)"/><text x="84" y="888" font-size="11.5" fill="#7d2b30" font-weight="800" text-anchor="start" letter-spacing="1.1">ROLLBACK</text><text x="390" y="918.82" font-size="12" fill="#7d2b30" font-weight="600" text-anchor="middle">Execute the agreed rollback procedure: restore the snapshot or recover the source, revert DNS/CNAME,</text><text x="390" y="937.82" font-size="12" fill="#7d2b30" font-weight="600" text-anchor="middle">restart the source and re-open the incident path. Record the reason and evidence for the No-Go.</text></svg>
