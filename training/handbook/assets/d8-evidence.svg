<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" width="100%" role="img" preserveAspectRatio="xMidYMid meet" style="max-width:1440px;height:auto;background:#fff;font-family:Inter,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;">
<defs><pattern id="d8-evidence-grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#e6ebf2" stroke-width="1"/></pattern><filter id="d8-evidence-sh" x="-14%" y="-14%" width="132%" height="155%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b2545" flood-opacity="0.14"/></filter><linearGradient id="d8-evidence-hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f2b4c"/><stop offset="1" stop-color="#1b4f86"/></linearGradient><marker id="d8-evidence-arrow" markerWidth="9" markerHeight="9" refX="7.4" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3.2 L0 6.4 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="620" rx="0" fill="url(#d8-evidence-grid)" stroke="none" stroke-width="1.5"/><text x="40" y="52" font-size="21" fill="#0f2b4c" font-weight="800" text-anchor="start" letter-spacing="-0.2">Figure 8 — Evidence lifecycle: baseline, compare, correct, retest, handover</text><rect x="40" y="62" width="74" height="4" rx="2" fill="#1b4f86" stroke="none" stroke-width="1.5"/><text x="40" y="78" font-size="13.5" fill="#5b7288" font-weight="500" text-anchor="start">Working before migration should work after migration. Evidence is what turns that principle into something you can actually prove.</text><rect x="42.0" y="156" width="140" height="96" rx="10" fill="#e8f0fb" stroke="#1b4f86" stroke-width="1.5" filter="url(#d8-evidence-sh)"/><circle cx="112.0" cy="154" r="14" fill="#1b4f86"/><text x="112.0" y="158.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="112.0" y="206.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">Capture source</text><text x="112.0" y="222.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">baseline evidence</text><text x="188.0" y="210.0" font-size="20" fill="#8ea6c0" font-weight="700" text-anchor="middle">›</text><rect x="194.0" y="156" width="140" height="96" rx="10" fill="#e8f0fb" stroke="#1b4f86" stroke-width="1.5" filter="url(#d8-evidence-sh)"/><circle cx="264.0" cy="154" r="14" fill="#1b4f86"/><text x="264.0" y="158.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="264.0" y="206.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">Execute migration /</text><text x="264.0" y="222.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">cutover activities</text><text x="340.0" y="210.0" font-size="20" fill="#8ea6c0" font-weight="700" text-anchor="middle">›</text><rect x="346.0" y="156" width="140" height="96" rx="10" fill="#e8f0fb" stroke="#1b4f86" stroke-width="1.5" filter="url(#d8-evidence-sh)"/><circle cx="416.0" cy="154" r="14" fill="#1b4f86"/><text x="416.0" y="158.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="416.0" y="206.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">Capture equivalent</text><text x="416.0" y="222.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">target evidence</text><text x="492.0" y="210.0" font-size="20" fill="#8ea6c0" font-weight="700" text-anchor="middle">›</text><rect x="498.0" y="156" width="140" height="96" rx="10" fill="#fdf3d8" stroke="#d9a520" stroke-width="1.5" filter="url(#d8-evidence-sh)"/><circle cx="568.0" cy="154" r="14" fill="#d9a520"/><text x="568.0" y="158.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="568.0" y="206.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">Compare source</text><text x="568.0" y="222.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">against target</text><text x="644.0" y="210.0" font-size="20" fill="#8ea6c0" font-weight="700" text-anchor="middle">›</text><rect x="650.0" y="156" width="140" height="96" rx="10" fill="#fdf3d8" stroke="#d9a520" stroke-width="1.5" filter="url(#d8-evidence-sh)"/><circle cx="720.0" cy="154" r="14" fill="#d9a520"/><text x="720.0" y="158.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="720.0" y="206.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">Identify and log</text><text x="720.0" y="222.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">deviations</text><text x="796.0" y="210.0" font-size="20" fill="#8ea6c0" font-weight="700" text-anchor="middle">›</text><rect x="802.0" y="156" width="140" height="96" rx="10" fill="#fdecec" stroke="#c8434b" stroke-width="1.5" filter="url(#d8-evidence-sh)"/><circle cx="872.0" cy="154" r="14" fill="#c8434b"/><text x="872.0" y="158.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="872.0" y="206.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">Correct with the</text><text x="872.0" y="222.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">responsible team</text><text x="948.0" y="210.0" font-size="20" fill="#8ea6c0" font-weight="700" text-anchor="middle">›</text><rect x="954.0" y="156" width="140" height="96" rx="10" fill="#e6f4ea" stroke="#3d9a5f" stroke-width="1.5" filter="url(#d8-evidence-sh)"/><circle cx="1024.0" cy="154" r="14" fill="#3d9a5f"/><text x="1024.0" y="158.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><text x="1024.0" y="206.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">Retest the affected</text><text x="1024.0" y="222.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">check</text><text x="1100.0" y="210.0" font-size="20" fill="#8ea6c0" font-weight="700" text-anchor="middle">›</text><rect x="1106.0" y="156" width="140" height="96" rx="10" fill="#e6f4ea" stroke="#3d9a5f" stroke-width="1.5" filter="url(#d8-evidence-sh)"/><circle cx="1176.0" cy="154" r="14" fill="#3d9a5f"/><text x="1176.0" y="158.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">8</text><text x="1176.0" y="206.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">Capture final</text><text x="1176.0" y="222.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">evidence</text><text x="1252.0" y="210.0" font-size="20" fill="#8ea6c0" font-weight="700" text-anchor="middle">›</text><rect x="1258.0" y="156" width="140" height="96" rx="10" fill="#e9edf3" stroke="#0f2b4c" stroke-width="1.5" filter="url(#d8-evidence-sh)"/><circle cx="1328.0" cy="154" r="14" fill="#0f2b4c"/><text x="1328.0" y="158.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">9</text><text x="1328.0" y="206.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">Complete handover</text><text x="1328.0" y="222.32" font-size="12" fill="#0f2b4c" font-weight="700" text-anchor="middle">and sign-off</text><path d="M1024.0 252 V294 H568.0 V258" stroke="#c8434b" stroke-width="2.4" fill="none" stroke-dasharray="7 5" marker-end="url(#d8-evidence-arrow)"/><text x="726.0" y="314" font-size="11.5" fill="#c8434b" font-weight="700" text-anchor="middle">deviation not cleared → correct, then re-compare</text><rect x="60" y="340" width="640" height="210" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="1.5" filter="url(#d8-evidence-sh)"/><text x="84" y="372" font-size="11.5" fill="#1b4f86" font-weight="800" text-anchor="start" letter-spacing="1.1">CLASSIFYING A FAILURE</text><rect x="84" y="394" width="250" height="30" rx="6" fill="#e8f0fb" stroke="#9ec3ec" stroke-width="1.5"/><text x="209" y="414" font-size="11.3" fill="#0f2b4c" font-weight="700" text-anchor="middle">Working before, failing now</text><text x="350" y="414" font-size="11.3" fill="#3d5468" font-weight="500" text-anchor="start">Migration-related → owning team corrects and retests</text><rect x="84" y="430" width="250" height="30" rx="6" fill="#e8f0fb" stroke="#9ec3ec" stroke-width="1.5"/><text x="209" y="450" font-size="11.3" fill="#0f2b4c" font-weight="700" text-anchor="middle">Failing before, failing now</text><text x="350" y="450" font-size="11.3" fill="#3d5468" font-weight="500" text-anchor="start">Pre-existing condition → document it, do not absorb it</text><rect x="84" y="466" width="250" height="30" rx="6" fill="#e8f0fb" stroke="#9ec3ec" stroke-width="1.5"/><text x="209" y="486" font-size="11.3" fill="#0f2b4c" font-weight="700" text-anchor="middle">Failing before, working now</text><text x="350" y="486" font-size="11.3" fill="#3d5468" font-weight="500" text-anchor="start">Improvement → record it so it is not rolled back later</text><rect x="84" y="502" width="250" height="30" rx="6" fill="#e8f0fb" stroke="#9ec3ec" stroke-width="1.5"/><text x="209" y="522" font-size="11.3" fill="#0f2b4c" font-weight="700" text-anchor="middle">No baseline evidence exists</text><text x="350" y="522" font-size="11.3" fill="#3d5468" font-weight="500" text-anchor="start">Escalate: you cannot classify what you cannot prove</text><rect x="740" y="340" width="640" height="210" rx="12" fill="#fdf3d8" stroke="#d9a520" stroke-width="1.5" filter="url(#d8-evidence-sh)"/><text x="764" y="370" font-size="11.5" fill="#8a6410" font-weight="800" text-anchor="start" letter-spacing="1.1">EVIDENCE HYGIENE</text><text x="764" y="398" font-size="12" fill="#5c4a12" font-weight="600" text-anchor="start">•  Name files so SID, check, phase and date are obvious without opening them.</text><text x="764" y="424" font-size="12" fill="#5c4a12" font-weight="600" text-anchor="start">•  Capture full output, not a cropped success line — context makes it defensible.</text><text x="764" y="450" font-size="12" fill="#5c4a12" font-weight="600" text-anchor="start">•  Attach evidence to the change/Jira record at the gate it supports, not at the end.</text><text x="764" y="476" font-size="12" fill="#5c4a12" font-weight="600" text-anchor="start">•  Store it per project retention and data-handling rules.</text><text x="764" y="502" font-size="12" fill="#5c4a12" font-weight="600" text-anchor="start">•  Source and target evidence must be comparable: same check, scope and tooling.</text></svg>
