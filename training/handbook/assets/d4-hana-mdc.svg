<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" role="img" preserveAspectRatio="xMidYMid meet" style="max-width:1440px;height:auto;background:#fff;font-family:Inter,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;">
<defs><pattern id="d4-hana-mdc-grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#e6ebf2" stroke-width="1"/></pattern><filter id="d4-hana-mdc-sh" x="-14%" y="-14%" width="132%" height="155%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b2545" flood-opacity="0.14"/></filter><linearGradient id="d4-hana-mdc-hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f2b4c"/><stop offset="1" stop-color="#1b4f86"/></linearGradient><marker id="d4-hana-mdc-arrow" markerWidth="9" markerHeight="9" refX="7.4" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3.2 L0 6.4 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="900" rx="0" fill="url(#d4-hana-mdc-grid)" stroke="none" stroke-width="1.5"/><text x="40" y="52" font-size="21" fill="#0f2b4c" font-weight="800" text-anchor="start" letter-spacing="-0.2">Figure 4 — SAP HANA MDC architecture, S3 backup backend and recovery flow</text><rect x="40" y="62" width="74" height="4" rx="2" fill="#1b4f86" stroke="none" stroke-width="1.5"/><text x="40" y="78" font-size="13.5" fill="#5b7288" font-weight="500" text-anchor="start">SystemDB and TenantDB are database containers inside one HANA system. They are not an HA design: high availability is a separate infrastructure-level decision (HSR, cluster, storage).</text><rect x="40" y="110" width="300" height="470" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="1.5" filter="url(#d4-hana-mdc-sh)"/><path d="M40 150 V122 A12 12 0 0 1 52 110 H328 A12 12 0 0 1 340 122 V150 Z" fill="url(#d4-hana-mdc-hdr)"/><text x="190.0" y="135.04" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0.2">Three-tier application validation</text><rect x="64" y="180" width="252" height="88" rx="10" fill="#e8f0fb" stroke="#1b4f86" stroke-width="1.5" filter="url(#d4-hana-mdc-sh)"/><text x="190" y="216" font-size="13.5" fill="#0f2b4c" font-weight="800" text-anchor="middle">1  UI / Presentation layer</text><text x="190" y="240" font-size="11.5" fill="#5b7288" font-weight="600" text-anchor="middle">SAP GUI, Fiori, browser</text><line x1="190" y1="268" x2="190" y2="296" stroke="#8ea6c0" stroke-width="2.4" marker-end="url(#d4-hana-mdc-arrow)"/><rect x="64" y="300" width="252" height="88" rx="10" fill="#e8f0fb" stroke="#1b4f86" stroke-width="1.5" filter="url(#d4-hana-mdc-sh)"/><text x="190" y="336" font-size="13.5" fill="#0f2b4c" font-weight="800" text-anchor="middle">2  Application layer</text><text x="190" y="360" font-size="11.5" fill="#5b7288" font-weight="600" text-anchor="middle">PAS / AAS work processes</text><line x1="190" y1="388" x2="190" y2="416" stroke="#8ea6c0" stroke-width="2.4" marker-end="url(#d4-hana-mdc-arrow)"/><rect x="64" y="420" width="252" height="88" rx="10" fill="#e6f4ea" stroke="#123b2a" stroke-width="1.5" filter="url(#d4-hana-mdc-sh)"/><text x="190" y="456" font-size="13.5" fill="#0f2b4c" font-weight="800" text-anchor="middle">3  Database layer</text><text x="190" y="480" font-size="11.5" fill="#5b7288" font-weight="600" text-anchor="middle">HANA SystemDB + TenantDB</text><rect x="64" y="520" width="252" height="44" rx="8" fill="#fdf3d8" stroke="#d9a520" stroke-width="1.5"/><text x="190" y="539.64" font-size="11.5" fill="#8a6410" font-weight="700" text-anchor="middle">Recovery order: database first,</text><text x="190" y="554.64" font-size="11.5" fill="#8a6410" font-weight="700" text-anchor="middle">then start and validate app servers</text><rect x="390" y="110" width="520" height="470" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="1.5" filter="url(#d4-hana-mdc-sh)"/><path d="M390 150 V122 A12 12 0 0 1 402 110 H898 A12 12 0 0 1 910 122 V150 Z" fill="url(#d4-hana-mdc-hdr)"/><text x="650.0" y="135.04" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0.2">HANA host — one EC2 instance / VM (or an HSR pair)</text><rect x="414" y="176" width="472" height="150" rx="10" fill="#f1e9f7" stroke="#8e5aa8" stroke-width="1.5" filter="url(#d4-hana-mdc-sh)"/><text x="650" y="202" font-size="14" fill="#4a2a5c" font-weight="800" text-anchor="middle">SystemDB  (SYSTEMDB)</text><text x="650" y="230.14" font-size="11.5" fill="#6b4a80" font-weight="600" text-anchor="middle">Central management and monitoring</text><text x="650" y="248.14" font-size="11.5" fill="#6b4a80" font-weight="600" text-anchor="middle">Own login context and credentials (SYSTEM user)</text><text x="650" y="266.14" font-size="11.5" fill="#6b4a80" font-weight="600" text-anchor="middle">Holds the backup catalogue for all tenants</text><rect x="414" y="344" width="472" height="150" rx="10" fill="#e6f4ea" stroke="#3d9a5f" stroke-width="1.5" filter="url(#d4-hana-mdc-sh)"/><text x="650" y="370" font-size="14" fill="#123b2a" font-weight="800" text-anchor="middle">TenantDB  (for example PRD)</text><text x="650" y="398.14" font-size="11.5" fill="#2f6b46" font-weight="600" text-anchor="middle">Application and data workload</text><text x="650" y="416.14" font-size="11.5" fill="#2f6b46" font-weight="600" text-anchor="middle">Own login context and credentials</text><text x="650" y="434.14" font-size="11.5" fill="#2f6b46" font-weight="600" text-anchor="middle">Own backup configuration and data volume</text><line x1="650" y1="326" x2="650" y2="340" stroke="#8e5aa8" stroke-width="2.4" marker-end="url(#d4-hana-mdc-arrow)"/><rect x="414" y="512" width="472" height="52" rx="8" fill="#ffffff" stroke="#c7d2e0" stroke-width="1.5"/><text x="650" y="526.068" font-size="11.3" fill="#5b7288" font-weight="600" text-anchor="middle">Services: nameserver (SystemDB) · indexserver (per tenant)</text><text x="650" y="542.068" font-size="11.3" fill="#5b7288" font-weight="600" text-anchor="middle">Pre-checks: sizing, shared FS, INI files, THP,</text><text x="650" y="558.068" font-size="11.3" fill="#5b7288" font-weight="600" text-anchor="middle">kernel/HANA version, evidence</text><rect x="950" y="110" width="450" height="470" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="1.5" filter="url(#d4-hana-mdc-sh)"/><path d="M950 150 V122 A12 12 0 0 1 962 110 H1388 A12 12 0 0 1 1400 122 V150 Z" fill="url(#d4-hana-mdc-hdr)"/><text x="1175.0" y="135.04" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0.2">Backup backend and recovery sequence</text><rect x="974" y="176" width="402" height="92" rx="10" fill="#e8f0fb" stroke="#1b4f86" stroke-width="1.5" filter="url(#d4-hana-mdc-sh)"/><text x="1175" y="204" font-size="14" fill="#0f2b4c" font-weight="800" text-anchor="middle">Amazon S3 bucket</text><text x="1175" y="233.64" font-size="11.5" fill="#3d5468" font-weight="600" text-anchor="middle">Backint agent or file-based backup</text><text x="1175" y="250.64" font-size="11.5" fill="#3d5468" font-weight="600" text-anchor="middle">Bucket + folders, RW policy, connectivity</text><circle cx="996" cy="300" r="14" fill="#1b4f86"/><text x="996" y="304.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="1016" y="303.248" font-size="11.8" fill="#3d5468" font-weight="600" text-anchor="start">Source backup completed and validated on the source system</text><circle cx="996" cy="344" r="14" fill="#1b4f86"/><text x="996" y="348.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="1016" y="339.748" font-size="11.8" fill="#3d5468" font-weight="600" text-anchor="start">Configuration files available: global.ini, nameserver.ini,</text><text x="1016" y="354.748" font-size="11.8" fill="#3d5468" font-weight="600" text-anchor="start">topology</text><circle cx="996" cy="388" r="14" fill="#1b4f86"/><text x="996" y="392.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="1016" y="383.748" font-size="11.8" fill="#3d5468" font-weight="600" text-anchor="start">Backup data on the S3 backend, permissions and path</text><text x="1016" y="398.748" font-size="11.8" fill="#3d5468" font-weight="600" text-anchor="start">verified</text><circle cx="996" cy="432" r="14" fill="#1b4f86"/><text x="996" y="436.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="1016" y="435.248" font-size="11.8" fill="#3d5468" font-weight="600" text-anchor="start">Target HANA configured, restore path and credentials set</text><circle cx="996" cy="476" r="14" fill="#1b4f86"/><text x="996" y="480.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="1016" y="479.248" font-size="11.8" fill="#3d5468" font-weight="600" text-anchor="start">Recovery initiated from the SystemDB / tenant context</text><circle cx="996" cy="520" r="14" fill="#1b4f86"/><text x="996" y="524.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="1016" y="515.748" font-size="11.8" fill="#3d5468" font-weight="600" text-anchor="start">Database and application connectivity validated, evidence</text><text x="1016" y="530.748" font-size="11.8" fill="#3d5468" font-weight="600" text-anchor="start">captured</text><rect x="40" y="610" width="1360" height="106" rx="12" fill="#0f2b4c" stroke="none" stroke-width="1.5" filter="url(#d4-hana-mdc-sh)"/><text x="64" y="640" font-size="11.5" fill="#8fb4de" font-weight="800" text-anchor="start" letter-spacing="1.2">RECOVERY FLOW</text><rect x="64" y="654" width="190" height="42" rx="8" fill="#1b4f86" stroke="#4b7cb3" stroke-width="1.5"/><text x="159" y="680" font-size="12.8" fill="#ffffff" font-weight="700" text-anchor="middle">Source backup</text><text x="267" y="682" font-size="20" fill="#8fb4de" font-weight="700" text-anchor="middle">›</text><rect x="280" y="654" width="190" height="42" rx="8" fill="#1b4f86" stroke="#4b7cb3" stroke-width="1.5"/><text x="375" y="680" font-size="12.8" fill="#ffffff" font-weight="700" text-anchor="middle">Configuration file</text><text x="483" y="682" font-size="20" fill="#8fb4de" font-weight="700" text-anchor="middle">›</text><rect x="496" y="654" width="190" height="42" rx="8" fill="#1b4f86" stroke="#4b7cb3" stroke-width="1.5"/><text x="591" y="680" font-size="12.8" fill="#ffffff" font-weight="700" text-anchor="middle">S3 backend</text><text x="699" y="682" font-size="20" fill="#8fb4de" font-weight="700" text-anchor="middle">›</text><rect x="712" y="654" width="190" height="42" rx="8" fill="#1b4f86" stroke="#4b7cb3" stroke-width="1.5"/><text x="807" y="680" font-size="12.8" fill="#ffffff" font-weight="700" text-anchor="middle">Target configuration</text><text x="915" y="682" font-size="20" fill="#8fb4de" font-weight="700" text-anchor="middle">›</text><rect x="928" y="654" width="190" height="42" rx="8" fill="#1b4f86" stroke="#4b7cb3" stroke-width="1.5"/><text x="1023" y="680" font-size="12.8" fill="#ffffff" font-weight="700" text-anchor="middle">Recovery</text><text x="1131" y="682" font-size="20" fill="#8fb4de" font-weight="700" text-anchor="middle">›</text><rect x="1144" y="654" width="190" height="42" rx="8" fill="#1b4f86" stroke="#4b7cb3" stroke-width="1.5"/><text x="1239" y="680" font-size="12.8" fill="#ffffff" font-weight="700" text-anchor="middle">Validation</text><rect x="40" y="736" width="1360" height="112" rx="12" fill="#fdf3d8" stroke="#d9a520" stroke-width="1.5" filter="url(#d4-hana-mdc-sh)"/><text x="64" y="766" font-size="11.5" fill="#8a6410" font-weight="800" text-anchor="start" letter-spacing="1.1">CUTOVER RULE</text><text x="64" y="794" font-size="13" fill="#5c4a12" font-weight="600" text-anchor="start">Test backup and recovery BEFORE cutover. During cutover take the final backup, validate it, and only then stop the source system.</text><text x="64" y="818" font-size="13" fill="#5c4a12" font-weight="600" text-anchor="start">The source stays available until the required final backup activity completes successfully — that backup is also your rollback anchor.</text><text x="40" y="878" font-size="12" fill="#7b8794" font-weight="500" text-anchor="start" font-style="italic">Source terminology preserved. Confirm Backint versus file-based backup, the exact INI/parameter set and the tenant naming convention against the project HANA standard before execution.</text></svg>
